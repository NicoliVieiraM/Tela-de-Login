<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css">
    <title>Tela de Login</title>
  </head>
  <body>
    <main id="form_container">
      <div id="form_header">
        <h1 id="form_title">Login</h1>
        <button class="btn-default">
          <i class="fa-solid fa-right-to-bracket" style="color: rgb(54, 129, 223)"></i>
        </button>
      </div>

      <form action="" id="form">
        <div id="input_container">
          <div class="input-box">
            <label for="email" class="form-label">Email</label>
            <div class="input_field">
              <input type="email" name="email" id="email" class="form-control" placeholder="exemplo@gmail.com" required />
              <i class="fa-regular fa-envelope"></i>
            </div>
          </div>

          <div class="input-box">
            <label for="password" class="form-label">Senha</label>
            <div class="input_field">
              <input type="password" name="password" id="password" class="form-control" placeholder="*********" required />
              <i class="fa-regular fa-eye-slash password-icon"></i>
            </div>
          </div>

          <div class="forgot-password">
            <a href="#">Esqueceu sua senha?</a>
          </div>

          <button type="submit" class="btn-default">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
          </button>

          <div class="register-link">
            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
          </div>
        </div>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
